constraints:
- id: afwe-core-must-not-afwe-cli
  rule: must_not_depend
  from: afwe-core
  to:
  - afwe-cli
  severity: error
  rationale: core engine must never depend on the CLI layer
- id: afwe-cli-must-not-exclusions-engine
  rule: must_not_depend
  from: afwe-cli
  to:
  - exclusions-engine
  severity: error
  phase: planned
  rationale: 'Future direction: CLI will talk to exclusions engine via public api.rs only'
- id: afwe-cli-must-not-timeline-snapshot
  rule: must_not_depend
  from: afwe-cli
  to:
  - timeline-snapshot
  severity: error
  phase: planned
  rationale: 'Future direction: CLI will talk to timeline snapshot via public api.rs only'
- id: afwe-core-bridges-must-not-depend-on-studio
  rule: must_not_depend
  from: graphify-bridge
  to:
  - studio
  - studio-prompt-gateway
  severity: error
  phase: planned
  rationale: 'Planned ecosystem bridges in afwe-core must remain headless and never depend on Studio UI'
- id: delta-bridge-must-not-depend-on-afwe-cli
  rule: must_not_depend
  from: delta-acp-bridge
  to:
  - afwe-cli
  severity: error
  phase: planned
  rationale: 'Planned DeltaDB/ACP bridge lives in afwe-core and is exposed only through api.rs'
