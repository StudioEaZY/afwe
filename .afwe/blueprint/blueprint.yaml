      name: Studio Timeline
      kind: module
      description: Unified 4D timeline dual-scrubber, turn history, and CodeMirror side-by-side diff workstation.
      implements:
        files:
        - apps/studio/src/components/TimelinePage.tsx
        - apps/studio/src/components/TimelineDualScrubber.tsx
        - apps/studio/src/components/CodeDiffViewer.tsx
      status: active
      origin: human
    - id: studio-governance
      name: Studio Governance
      kind: module
      description: Architectural blueprint page, standing checks and pins, decisions queue, two-tier quarantine modals, and settings.
      implements:
        files:
        - apps/studio/src/components/BlueprintPage.tsx
        - apps/studio/src/components/ChecksPage.tsx
        - apps/studio/src/components/DecisionsPage.tsx
        - apps/studio/src/components/GovernanceActionModal.tsx
