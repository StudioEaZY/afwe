format: afwe/2
project:
  name: afwe
  root: .
analyzer:
  include: []
  ignore:
  - .afwe/**
  - node_modules/**
  - target/**
  - dist/**
  - build/**
  - .git/**
  - '**/*.min.js'
  - '**/*.lock'
  max_file_size_kb: 512
  languages: []
policy:
  auto_reconcile_min: 0.7
  soft_reconcile_min: 0.5
  create_proposals: true
  fail_on_violation: true
  pins:
    slider: 4
  checkgen: true
provenance:
  retain_prompts: true
vcs:
  provider: git
  auto_commit: false
  test_command: .\target\debug\deps\end_to_end-cd83c87f2b1bd985.exe
ci:
  runs_on: ubuntu-latest
  fixed_job_name: afwe-gate
  verify_turn_records: true
profile: engineer
