id: autostart-observable
title: Make autostart observable and project-scoped
statement: Studio health reports its project root, so a daemon for another project is reported instead of silently reused. Spawn or readiness failures are printed and logged as studio_autostart_failed or watcher_autostart_failed, and AFWE_NO_AUTOSTART disables both.
