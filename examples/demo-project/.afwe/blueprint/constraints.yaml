constraints:
- id: c-data-no-web
  rule: must_not_depend
  from: Data/models
  to:
  - Web/views
  rationale: Database models tier must never depend upward on Web presentation views.
  severity: error
- id: c-core-no-backend
  rule: must_not_depend
  from: Core/models
  to:
  - Backend/api
  rationale: Core domain logic must not couple to external Backend HTTP API layer.
  severity: error
- id: c-infra-no-services
  rule: must_not_depend
  from: Infrastructure/deploy
  to:
  - Services/billing
  rationale: Infrastructure deployment components must remain decoupled from business billing services.
  severity: error
- id: c-web-no-direct-data
  rule: must_not_depend
  from: Web/views
  to:
  - Data/schema
  rationale: Web views must consume Backend API endpoints, never direct Data storage schemas.
  severity: error
